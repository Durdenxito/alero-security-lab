name: Pruebas y análisis de vulnerabilidades
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Analizar con ZAP y Nuclei
        run: npm run scan
      - name: Conservar pruebas y reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folio-quality
          path: |
            artifacts/security/
            playwright-report/
          if-no-files-found: error
